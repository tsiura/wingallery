# Tests the gallery, then builds its image and pushes it to Docker Hub on every push to main (README: QNAP with Container Station).
# Needs the environment DOCKERHUB with DOCKERHUB_USERNAME (a variable or a secret) and the secret DOCKERHUB_TOKEN, a Docker Hub access token
# with Read & Write.
name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    env:
      USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/wingallery
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: docker build --pull --target check .

      - name: Build
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Push
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login -u "$USERNAME" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
